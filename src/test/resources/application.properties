# ------------------ TEST APPLICATION ------------------
spring.config.import=optional:file:./.env[.properties]
spring.application.name=booking-service


# ------------------ DATABASE ------------------

# Database configuration is provided automatically by the MySQL Testcontainer
# through @ServiceConnection in MySqlTestContainerConfig.
# Therefore, no DB_USERNAME or DB_PASSWORD is required here.


# ------------------ JPA / HIBERNATE ------------------

# Allows Hibernate to create/update the required test database schema.
spring.jpa.hibernate.ddl-auto=update

# Keeps integration-test logs cleaner.
spring.jpa.show-sql=false

# Formats SQL when SQL logging is enabled.
spring.jpa.properties.hibernate.format_sql=true


# ------------------ GMAIL SERVICE ------------------

# Test-only mail configuration required for JavaMailSender creation.
# No real email should be sent during this integration test.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# ------------------ DEODAR DREAMS CONTACT ------------------

# Test-only values required by EmailServiceImpl.
deodar.dreams.contact-phone=9999999999
deodar.dreams.alert-mail=test@deodardreams.com


# ------------------ JWT TOKEN ------------------

# Test-only JWT secret required while creating the Spring application context.
app.jwt.secret=test-secret-for-integration-tests

# 24 hours in milliseconds.
app.jwt.expiration-ms=86400000


# ------------------ RAZORPAY ------------------

# Uses the Razorpay TEST API credentials from environment variables.
# These are required because the integration test will communicate with
# Razorpay's test environment when creating a payment order.
razorpay.key.id=${RAZOR_TEST_KEY}
razorpay.key.secret=${RAZOR_TEST_SECRET}
razorpay.webhook.secret=${RAZOR_WEBHOOK_SECRET}


# ------------------ ACTUATOR ------------------

management.endpoints.web.exposure.include=health,info,metrics


# ------------------ LOGGING ------------------

logging.level.root=INFO
logging.level.com.deodardreams=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

management.observations.annotations.enabled=true